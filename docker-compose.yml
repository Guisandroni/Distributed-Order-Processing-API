services:
  postgres:
    image: postgres:17-alpine
    container_name: order-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: nestjsCrud
      POSTGRES_PASSWORD: nestjsCrud
      POSTGRES_DB: nestjsCrud

    ports:
      - 2020:5432

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - order-platform

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjsCrud -d nestjsCrud']
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:4-management
    container_name: order-platform-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: nestOrder
      RABBITMQ_DEFAULT_PASS: nestOrder

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - order-platform

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order-platform-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - order-platform

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: order-platform-api
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://nestjsCrud:nestjsCrud@postgres:5432/nestjsCrud?schema=public"
      RABBITMQ_URL: "amqp://nestOrder:nestOrder@rabbitmq:5672"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-local-dev-secret}"
      PORT: "3333"

    ports:
      - "3333:3333"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - order-platform

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # Migra o banco antes de servir (a imagem final inclui o CLI do prisma).
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/apps/simple-crud-nestjs/apps/simple-crud-nestjs/src/main"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: order-platform-worker
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://nestjsCrud:nestjsCrud@postgres:5432/nestjsCrud?schema=public"
      RABBITMQ_URL: "amqp://nestOrder:nestOrder@rabbitmq:5672"

    # A API saudável implica migrate aplicado: o worker só consome
    # mensagens que a API publica após migrar.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

    networks:
      - order-platform

    # Sem servidor HTTP no worker: sonda = processo vivo + broker alcançável.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('amqplib').connect(process.env.RABBITMQ_URL).then((c) => c.close()).then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: order-platform-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - order-platform

  grafana:
    image: grafana/grafana:latest
    container_name: order-platform-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - order-platform

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  order-platform:
    driver: bridge
