services:
  postgres:
    image: postgres:17-alpine
    container_name: order-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: nestjpostgres
      POSTGRES_PASSWORD: nestjpostgres
      POSTGRES_DB: order_platform

    ports:
      - 2020:5432

    volumes:
      - postgres_data:/var/lib/postgresql/data


  rabbitmq:
     image: rabbitmq:4-management
     container_name: order-platform-rabbitmq
     restart: unless-stopped

     environment:
       RABBITMQ_DEFAULT_USER: nestOrder
       RABBITMQ_DEFAULT_PASS: nestOrder

     ports:
      - "5672:5672"
      - "15672:15672"

     volumes:
      - rabbitmq_data:/var/lib/rabbitmq


     healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
