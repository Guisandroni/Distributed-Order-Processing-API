# Scales independently from the api Deployment (separate object,
# separate replica count — queue-based scaling is future work).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          # Local drill image (kind load). Production uses the registry
          # path + tag published by the deploy workflow.
          image: order-platform-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-platform-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: order-platform-secrets
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: order-platform-secrets
                  key: REDIS_URL
          # No HTTP server in the worker: probe = process alive + broker
          # reachable (same check as the compose HEALTHCHECK).
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require('amqplib').connect(process.env.RABBITMQ_URL).then((c) => c.close()).then(() => process.exit(0)).catch(() => process.exit(1))
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require('amqplib').connect(process.env.RABBITMQ_URL).then((c) => c.close()).then(() => process.exit(0)).catch(() => process.exit(1))
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
