# Drill-only dependencies (T027): backing services inside kind so pods
# can actually become Ready. Production uses managed services from
# infra/ (RDS/ElastiCache/Amazon MQ) — NOT these Deployments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-postgres
  namespace: order-platform
  labels:
    drill-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drill-postgres
  template:
    metadata:
      labels:
        app: drill-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: drill
            - name: POSTGRES_PASSWORD
              value: drill
            - name: POSTGRES_DB
              value: drill
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: drill-postgres
  namespace: order-platform
spec:
  selector:
    app: drill-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-redis
  namespace: order-platform
  labels:
    drill-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drill-redis
  template:
    metadata:
      labels:
        app: drill-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: drill-redis
  namespace: order-platform
spec:
  selector:
    app: drill-redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-rabbitmq
  namespace: order-platform
  labels:
    drill-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drill-rabbitmq
  template:
    metadata:
      labels:
        app: drill-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: drill
            - name: RABBITMQ_DEFAULT_PASS
              value: drill
          ports:
            - containerPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: drill-rabbitmq
  namespace: order-platform
spec:
  selector:
    app: drill-rabbitmq
  ports:
    - port: 5672
