# CI — install → lint → typecheck → full test matrix → build.
#
# Honest-gate notes (do not "fix" by deleting):
# - lint = prettier --check. The type-aware eslint profile reports 150+
#   pre-existing findings across untouched files (mostly no-unsafe-*);
#   cleaning those is out of scope — tracked as follow-up, not in this gate.
# - typecheck = `pnpm build` (nest per-project tsc). A root `tsc --noEmit`
#   reports pre-existing errors in legacy test files; same follow-up status.
# - prisma generate runs before build (fresh checkouts lack generated/).
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL_TEST: postgresql://test:test@127.0.0.1:2021/order_platform_test
  RABBITMQ_URL_TEST: amqp://test:test@127.0.0.1:5673
  REDIS_URL_TEST: redis://127.0.0.1:6380
  OUTBOX_POLL_MS: 500

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: order_platform_test
        ports:
          - 2021:5432
        options: >-
          --health-cmd "pg_isready -U test -d order_platform_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5673:5672
          - 15673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (format gate)
        run: pnpm exec prettier --check "apps/**/*.ts" "libs/**/*.ts"

      - name: Migrate test database
        run: DATABASE_URL="${{ env.DATABASE_URL_TEST }}" pnpm exec prisma migrate deploy

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Distributed E2E tests
        run: pnpm test:e2e:distributed

      - name: Typecheck + build
        run: pnpm exec prisma generate && pnpm build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Validate-only gate: no credentials, no resources, zero cloud spend.
      # plan/apply stay documented manual steps (infra/README.md).
      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate (root)
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Terraform validate (dev)
        run: |
          terraform -chdir=infra/environments/dev init -backend=false
          terraform -chdir=infra/environments/dev validate

      - name: Terraform validate (prod)
        run: |
          terraform -chdir=infra/environments/prod init -backend=false
          terraform -chdir=infra/environments/prod validate
