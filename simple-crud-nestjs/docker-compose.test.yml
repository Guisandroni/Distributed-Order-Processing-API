name: order-platform-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: order_platform_test
    ports:
      - '2021:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d order_platform_test']
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq-test:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - '5673:5672'
      - '15673:15672'
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20
